<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories — Context For Humans</title>
    <link rel="stylesheet" href="sidepanel.css">
    <link rel="stylesheet" href="graph-page.css">
  </head>
  <body class="graph-page">
    <header class="top">
      <div>
        <p class="eyebrow"><img class="brand-logo" src="../icons/brain.svg" alt="">Context For Humans</p>
        <h1>Categories</h1>
      </div>
      <span id="counts" class="counts">Loading graph...</span>
    </header>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <main>
      <section class="graph-section" aria-label="Conversation project graph">
        <div id="graph" class="graph"></div>
        <div id="project-detail" class="graph-detail" hidden></div>
      </section>
    </main>
    <script src="panel-error.js"></script>
    <script type="module" src="graph-page.js"></script>
  </body>
</html>
